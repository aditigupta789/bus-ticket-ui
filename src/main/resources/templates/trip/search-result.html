<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Trips</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container page">
    <div class="header">
        <h2>Search Results</h2>
        <a class="link-back" th:href="@{/trip/dashboard}">← Back to dashboard</a>
    </div>

    <p class="muted" th:if="${source != null and destination != null}">
        <span th:text="${source}">Mumbai</span> → <span th:text="${destination}">Pune</span>
    </p>

    <div class="card result-card">
        <div class="error" th:if="${tripsError}" th:text="${tripsError}"></div>

        <div class="result" th:if="${trips != null and #lists.size(trips) > 0 and tripsError == null}">
            <table>
                <thead>
                <tr>
                    <th>Trip ID</th>
                    <th>Route ID</th>
                    <th>Bus ID</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Departure</th>
                    <th>Arrival</th>
                    <th>Trip Date</th>
                    <th>Fare</th>
                    <th>Available Seats</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="trip : ${trips}">
                    <td th:text="${trip['tripId'] != null ? trip['tripId'] : (trip['trip_id'] != null ? trip['trip_id'] : 'N/A')}"></td>
                    <td th:text="${trip['routeId'] != null ? trip['routeId'] : (trip['route_id'] != null ? trip['route_id'] : 'N/A')}"></td>
                    <td th:text="${trip['busId'] != null ? trip['busId'] : (trip['bus_id'] != null ? trip['bus_id'] : 'N/A')}"></td>
                    <td th:text="${trip['fromCity'] != null ? trip['fromCity'] : (trip['from_city'] != null ? trip['from_city'] : 'N/A')}"></td>
                    <td th:text="${trip['toCity'] != null ? trip['toCity'] : (trip['to_city'] != null ? trip['to_city'] : 'N/A')}"></td>
                    <td th:text="${trip['departureTime'] != null ? trip['departureTime'] : (trip['departure_time'] != null ? trip['departure_time'] : 'N/A')}"></td>
                    <td th:text="${trip['arrivalTime'] != null ? trip['arrivalTime'] : (trip['arrival_time'] != null ? trip['arrival_time'] : 'N/A')}"></td>
                    <td th:text="${trip['tripDate'] != null ? trip['tripDate'] : (trip['trip_date'] != null ? trip['trip_date'] : 'N/A')}"></td>
                    <td th:text="${trip['fare'] != null ? trip['fare'] : 'N/A'}"></td>
                    <td th:text="${trip['availableSeats'] != null ? trip['availableSeats'] : (trip['available_seats'] != null ? trip['available_seats'] : 'N/A')}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="muted result" th:if="${trips != null and #lists.size(trips) == 0 and tripsError == null}" style="margin-top: 14px;">
            No trips found.
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
