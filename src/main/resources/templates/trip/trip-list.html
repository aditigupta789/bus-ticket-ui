<!doctype html>
<!--
    Page: Trips Dashboard
    Purpose: Entry point for trip-related operations (search trips and check seat availability)
    Data Source: User input (forms) + session data (username)
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trips Dashboard — BusTicket</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════ */
        :root {
            --evergreen:     #002626;
            --dark-teal:     #0e4749;
            --lime-cream:    #d6f599;
            --cayenne-red:   #e55812;
            --soft-linen:    #efe7da;
            --white-glass:   rgba(255, 255, 255, 0.78);
            --border-subtle: rgba(14, 71, 73, 0.13);
            --shadow-card:   0 1px 3px rgba(0,38,38,0.06),
                             0 8px 24px rgba(0,38,38,0.10),
                             0 32px 64px rgba(0,38,38,0.08);
            --radius-card:   20px;
            --radius-btn:    12px;
            --radius-input:  12px;
            --transition:    0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--soft-linen);
            background-image:
                radial-gradient(ellipse 80% 50% at 15% -5%,  rgba(14,71,73,0.16)  0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 90% 110%, rgba(0,38,38,0.18)   0%, transparent 55%),
                radial-gradient(ellipse 50% 35% at 85% 5%,   rgba(229,88,18,0.08) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--evergreen);
        }

        /* ── TOPBAR ── */
        .topbar {
            background: var(--evergreen);
            height: 58px;
            padding: 0 2.25rem;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.18);
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .topbar-bus-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--lime-cream), #b8e06a);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
        }
        .topbar-logo-text {
            font-family: 'DM Serif Display', serif;
            font-size: 1.05rem;
            color: var(--lime-cream);
        }
        .topbar-sep {
            width: 1px; height: 22px;
            background: rgba(214,245,153,0.2);
            margin: 0 1.1rem;
        }
        .topbar-context {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(214,245,153,0.5);
        }
        .topbar-spacer { flex: 1; }
        .topbar-user {
            font-size: 0.78rem;
            color: rgba(214,245,153,0.55);
            font-weight: 500;
            margin-right: 0.75rem;
        }
        .topbar-logout {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--evergreen);
            background: var(--lime-cream);
            padding: 4px 12px;
            border-radius: 20px;
            text-decoration: none;
            transition: filter var(--transition);
        }
        .topbar-logout:hover { filter: brightness(0.92); }

        /* ── MAIN ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.75rem 1rem 3.5rem;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            width: 100%;
            max-width: 860px;
            margin-bottom: 2rem;
        }
        .page-eyebrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .eyebrow-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--cayenne-red);
        }
        .eyebrow-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--dark-teal);
        }
        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.9rem;
            color: var(--evergreen);
            line-height: 1.15;
        }

        /* ── GRID ── */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            width: 100%;
            max-width: 860px;
        }
        @media (max-width: 700px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* ── CARD ── */
        .portal-card {
            background: var(--white-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .card-rail {
            height: 4px;
            background: linear-gradient(90deg, var(--evergreen), var(--dark-teal), var(--cayenne-red));
        }
        .card-inner { padding: 1.75rem; }

        .card-eyebrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.65rem;
        }
        .card-icon {
            width: 36px; height: 36px;
            border-radius: 9px;
            background: rgba(14,71,73,0.08);
            border: 1px solid rgba(14,71,73,0.10);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .card-icon svg { width: 17px; height: 17px; stroke: var(--dark-teal); }
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--evergreen);
        }
        .card-subtitle {
            font-size: 0.79rem;
            color: rgba(14,71,73,0.55);
            margin-bottom: 1.2rem;
            line-height: 1.45;
        }

        .card-divider {
            height: 1px;
            background: rgba(14,71,73,0.08);
            margin-bottom: 1.2rem;
        }

        /* ── FORM ── */
        .field-block { margin-bottom: 0.85rem; }
        .field-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            color: var(--dark-teal);
            margin-bottom: 0.45rem;
        }
        .field-label-req { color: var(--cayenne-red); }

        .field-input {
            width: 100%;
            padding: 0.72rem 1rem;
            background: rgba(239,231,218,0.45);
            border: 1.5px solid rgba(14,71,73,0.18);
            border-radius: var(--radius-input);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--evergreen);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }
        .field-input::placeholder { color: rgba(14,71,73,0.32); font-weight: 400; }
        .field-input:hover { border-color: rgba(14,71,73,0.32); }
        .field-input:focus {
            border-color: var(--dark-teal);
            box-shadow: 0 0 0 3.5px rgba(14,71,73,0.09);
            background: rgba(255,255,255,0.9);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        /* ── BUTTON ── */
        .btn-action {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.78rem 1.1rem;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, var(--evergreen), var(--dark-teal));
            color: var(--lime-cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.85rem;
            box-shadow: 0 2px 8px rgba(0,38,38,0.22), 0 1px 2px rgba(0,38,38,0.15);
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
            letter-spacing: 0.2px;
        }
        .btn-action::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.10) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.42s ease;
        }
        .btn-action:hover::before { transform: translateX(100%); }
        .btn-action:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 6px 20px rgba(0,38,38,0.28), 0 2px 6px rgba(0,38,38,0.16);
        }
        .btn-action:active { transform: translateY(0) scale(0.99); }
        .btn-arrow {
            font-size: 1rem;
            transition: transform var(--transition);
        }
        .btn-action:hover .btn-arrow { transform: translateX(3px); }

        /* ── FOOTER ── */
        .page-foot {
            margin-top: 2.5rem;
            font-size: 0.74rem;
            color: rgba(14,71,73,0.38);
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<header class="topbar">
    <a class="topbar-brand" th:href="@{/trip/dashboard}">
        <div class="topbar-bus-icon">🚌</div>
        <span class="topbar-logo-text">BusTicket</span>
    </a>
    <div class="topbar-sep"></div>
    <span class="topbar-context">Trip Management</span>
    <div class="topbar-spacer"></div>
    <span class="topbar-user"
          th:text="${session.username != null ? 'Hi, ' + session.username : 'Guest'}">
    </span>
    <a class="topbar-logout" th:href="@{/logout}">Logout</a>
</header>

<!-- ══ MAIN ══ -->
<main>

    <!-- Page heading -->
    <div class="page-header">
        <div class="page-eyebrow">
            <div class="eyebrow-dot"></div>
            <span class="eyebrow-text">Operations</span>
        </div>
        <h1 class="page-title">Trips Dashboard</h1>
    </div>

    <!-- Two-column cards -->
    <div class="dashboard-grid">

        <!-- ── SEAT AVAILABILITY ── -->
        <div class="portal-card">
            <div class="card-rail"></div>
            <div class="card-inner">
                <div class="card-eyebrow">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="3"/>
                            <path d="M7 8h10M7 12h6"/>
                        </svg>
                    </div>
                    <span class="card-title">Available Seats</span>
                </div>
                <p class="card-subtitle">Enter a Trip ID to check current seat availability for that trip.</p>
                <div class="card-divider"></div>

                <form th:action="@{/trip/seats}" method="get">
                    <div class="field-block">
                        <label class="field-label" for="tripId">
                            Trip ID <span class="field-label-req">*</span>
                        </label>
                        <input class="field-input"
                               id="tripId" name="tripId"
                               type="number" min="1"
                               placeholder="e.g. 42"
                               required autocomplete="off"/>
                    </div>
                    <button class="btn-action" type="submit">
                        <span>Check Seats</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- ── SEARCH TRIPS ── -->
        <div class="portal-card">
            <div class="card-rail"></div>
            <div class="card-inner">
                <div class="card-eyebrow">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                    </div>
                    <span class="card-title">Search Trips</span>
                </div>
                <p class="card-subtitle">Find available trips between a source and destination city.</p>
                <div class="card-divider"></div>

                <form th:action="@{/trip/search}" method="get">
                    <div class="field-row">
                        <div class="field-block">
                            <label class="field-label" for="source">
                                Source <span class="field-label-req">*</span>
                            </label>
                            <input class="field-input"
                                   id="source" name="source"
                                   type="text"
                                   placeholder="e.g. Mumbai"
                                   required autocomplete="off"/>
                        </div>
                        <div class="field-block">
                            <label class="field-label" for="destination">
                                Destination <span class="field-label-req">*</span>
                            </label>
                            <input class="field-input"
                                   id="destination" name="destination"
                                   type="text"
                                   placeholder="e.g. Pune"
                                   required autocomplete="off"/>
                        </div>
                    </div>
                    <button class="btn-action" type="submit">
                        <span>Search Trips</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <p class="page-foot">Data is fetched live from the backend service at each request.</p>
</main>

</body>
</html>
