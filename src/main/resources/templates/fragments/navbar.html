<!--
    Fragment: Navbar
    Purpose: Reusable navigation bar displayed across pages
    Usage: Included using Thymeleaf (th:replace / th:insert)

    Features:
      - Displays application branding (home/dashboard link)
      - Shows logged-in user from session
      - Provides logout functionality
-->

<nav xmlns:th="http://www.thymeleaf.org" th:fragment="navbar" class="nav-outer">
    <div class="container nav">
        <a class="brand" th:href="@{/trip/dashboard}">BusTicket Booking</a>
        <div class="nav-right">
            <span class="muted nav-user">
                User:
                <span th:text="${session.username != null ? session.username : 'Guest'}">Guest</span>
            </span>
            <a class="link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
