<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css?v=2}">
</head>

<body>

<!-- HERO SECTION -->
<div class="hero">
    <img src="/images/customer-bus.jpg" alt="Dashboard Image">

    <div class="overlay">
        <h1>Welcome Customer 👤</h1>
    </div>
</div>

<!-- CARDS -->
<div class="card-container">

    <!-- Routes -->
    <div class="card">
        <h3>🗺️ Routes</h3>

        <form action="/routes" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <!-- Trips -->
    <div class="card">
        <h3>🚍 Trips</h3>

        <form action="/trip/dashboard" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

</div>

</body>
</html>
