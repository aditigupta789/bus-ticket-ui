<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agency Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css?v=2}">
</head>

<body>

<!-- HERO SECTION -->
<div class="hero">
    <img src="/images/agency-bus-travel.jpg" alt="Dashboard Image">

    <div class="overlay">
        <h1>Welcome Agency 🚍</h1>
    </div>
</div>

<!-- ACTION CARDS -->
<div class="card-container">

    <div class="card">
        <h3>Search Customers</h3>
        <p>Find customers & bookings</p>

        <form action="/customer" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="card">
        <h3>Customers</h3>
        <p>Fetch customers by agency ID</p>

        <form action="/agency/customers" method="get">
            <button type="submit">Go</button>
        </form>
    </div>

    <div class="card">
        <h3>Agency Office</h3>
        <p>Manage office operations</p>

        <form action="/agency-office" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="card">
        <h3>Routes</h3>
        <p>Search routes</p>

        <form action="/routes" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="card">
        <h3>Trips</h3>
        <p>Search trips & seats</p>

        <form action="/trip/dashboard" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="card">
        <h3>Offices</h3>
        <p>View agency offices</p>

        <form action="/agency/offices" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="card">
        <h3>Buses</h3>
        <p>View buses by date</p>

        <form action="/agency/buses" method="get">
            <button type="submit">Open</button>
        </form>
    </div>

</div>

</body>
