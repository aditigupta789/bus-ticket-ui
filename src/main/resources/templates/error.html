<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="app-card app-card-pad text-center">

                    <h2 class="text-danger mb-3">Something went wrong</h2>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}">
                        Error message
                    </div>

                    <p class="text-muted">
                        Please try again or go back to the main page.
                    </p>

                    <a href="/agency-office" class="btn app-btn-primary mt-2">
                        Go to Agency Office
                    </a>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
