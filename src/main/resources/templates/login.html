<!DOCTYPE html>
<!--
    Page: Login
    Purpose: Authenticates user and starts session
    Data Source: User input (username, password) + backend response (error message)

    Features:
      - Login form with username and password
      - Sends POST request to /login
      - Displays error message for invalid credentials

    Flow:
      - User enters credentials → /login → AuthService → redirect based on role
-->

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/login.css?v=5}">
    <title>Login</title>
</head>
<body>

<div class="main-container">

    <!-- LEFT SIDE (FORM) -->
    <div class="login-left">
        <h1>Hello Again!</h1>
        <p class="subtitle">Welcome back, please login to continue</p>

        <form action="/login" method="post">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Sign In</button>

        </form>

        <!-- ERROR -->
        <p class="error-text" th:if="${error}" th:text="${error}"></p>

    </div>

    <!-- RIGHT SIDE (IMAGE) -->
    <div class="login-right">
        <img src="/images/bus.jpg" alt="Bus Image">
    </div>

</div>

<footer>
    <p>© 2026 Bus Booking System</p>
</footer>

</body>
</html>
