<!DOCTYPE html>
<!--
    Page: Login
    Purpose: Authenticates user and starts session
    Data Source: User input (username, password) + backend response (error message)

    Features:
      - Login form with username and password
      - Sends POST request to /login
      - Displays error message for invalid credentials

    Flow:
      - User enters credentials → /login → AuthService → redirect based on role
-->

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/customers.css?v=2}">
    <title>Login</title>
</head>
<body>
<h2>Login</h2>

<!-- LOGIN FORM -->
<div class="container">
    <form action="/login" method="post">

        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter Username" required />

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter Password" required />

        <button type="submit">Login</button>
    </form>
</div>

<hr>

<!-- ERROR MESSAGE -->
<p class="no-data" th:if="${error}" th:text="${error}"></p>

</body>
</html>
