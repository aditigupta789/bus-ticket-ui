<!DOCTYPE html>
<!--
    Page: Search Results
    Purpose: Displays routes based on user search (source → destination)
    Data Source: Backend via Thymeleaf (routes list, error message)

    States:
      - Error (invalid input / no results / backend issue)
      - Results (list of matching routes)
-->

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" th:href="@{/css/route.css}">
</head>
<body>

<div class="container">
    <h2>Search Results</h2>
    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <div class="card-container" th:if="${routes != null}">
        <div class="card" th:each="route : ${routes}">
            <h3 th:text="${route.fromCity} + ' → ' + ${route.toCity}"></h3>
            <p>Duration:
                <b th:text="${route.duration} + ' hrs'"></b>
            </p>
            <p>Stops:
                <span th:text="${route.breakPoints}"></span>
            </p>
        </div>

    </div>
    <div style="text-align:center; margin-top:20px;">
        <a th:href="@{/routes}">⬅ Back</a>
    </div>

</div>

</body>
</html>
