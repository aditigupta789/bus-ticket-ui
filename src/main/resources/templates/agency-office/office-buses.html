<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Office Buses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="app-card app-card-pad">

                <!-- HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="app-heading h4 m-0">
                        Buses for Office <span th:text="${officeId}"></span>
                    </h1>
                    <a class="btn btn-sm app-btn-outline" th:href="@{/agency-office}">Back</a>
                </div>

                <!-- ERROR -->
                <div th:if="${error}" class="alert alert-danger text-start" th:text="${error}"></div>

                <!-- DATA -->
                <div th:if="${buses != null}">

                    <!-- EMPTY -->
                    <div th:if="${#lists.isEmpty(buses)}" class="alert alert-warning text-start">
                        No buses found for this office.
                    </div>

                    <!-- TABLE -->
                    <div th:if="${!#lists.isEmpty(buses)}" class="app-card mt-3">
                        <table class="table table-striped table-hover mb-0 app-table">
                            <thead>
                            <tr>
                                <th>Bus ID</th>
                                <th>Type</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="bus : ${buses}">
                                <td th:text="${bus.busId}"></td>
                                <td th:text="${bus.type}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>
        </div>
    </div>

</main>

</body>
</html>
