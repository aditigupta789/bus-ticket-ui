<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Agency Office — Bus Ticket UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* ═══════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════ */
        :root {
            --evergreen:      #002626;
            --dark-teal:      #0e4749;
            --lime-cream:     #d6f599;
            --cayenne-red:    #e55812;
            --soft-linen:     #efe7da;
            --white-glass:    rgba(255, 255, 255, 0.78);
            --border-subtle:  rgba(14, 71, 73, 0.13);
            --shadow-card:    0 1px 3px rgba(0,38,38,0.06),
            0 8px 24px rgba(0,38,38,0.10),
            0 32px 64px rgba(0,38,38,0.08);
            --radius-card:    20px;
            --radius-input:   12px;
            --radius-btn:     12px;
            --transition:     0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--soft-linen);
            background-image:
                    radial-gradient(ellipse 80% 50% at 15% -5%,  rgba(14,71,73,0.16)  0%, transparent 60%),
                    radial-gradient(ellipse 60% 40% at 90% 110%,  rgba(0,38,38,0.18)   0%, transparent 55%),
                    radial-gradient(ellipse 50% 35% at 85% 5%,    rgba(229,88,18,0.08) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .topbar {
            background: var(--evergreen);
            height: 58px;
            padding: 0 2.25rem;
            display: flex;
            align-items: center;
            gap: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.18);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .topbar-bus-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--lime-cream) 0%, #b8e06a 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .topbar-logo-text {
            font-family: 'DM Serif Display', serif;
            font-size: 1.05rem;
            color: var(--lime-cream);
            letter-spacing: 0.3px;
        }

        .topbar-sep {
            width: 1px;
            height: 22px;
            background: rgba(214,245,153,0.2);
            margin: 0 1.1rem;
        }

        .topbar-context {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(214,245,153,0.5);
        }

        .topbar-spacer { flex: 1; }

        .topbar-tag {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--evergreen);
            background: var(--lime-cream);
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* ── PAGE LAYOUT ── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* ── PORTAL CARD ── */
        .portal-card {
            width: 100%;
            max-width: 460px;
            background: var(--white-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .card-rail {
            height: 4px;
            background: linear-gradient(90deg,
            var(--evergreen)   0%,
            var(--dark-teal)  45%,
            var(--cayenne-red) 100%);
        }

        .card-inner {
            padding: 2.25rem 2.25rem 2rem;
        }

        /* ── PAGE HEADER ── */
        .page-eyebrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .eyebrow-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cayenne-red);
        }

        .eyebrow-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--dark-teal);
        }

        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.75rem;
            color: var(--evergreen);
            line-height: 1.15;
            margin-bottom: 0.3rem;
        }

        .page-subtitle {
            font-size: 0.83rem;
            color: rgba(14,71,73,0.62);
            font-weight: 400;
            margin-bottom: 1.75rem;
        }

        .card-divider {
            height: 1px;
            background: linear-gradient(90deg,
            rgba(14,71,73,0.12) 0%,
            rgba(14,71,73,0.04) 100%);
            margin-bottom: 1.75rem;
        }

        /* ── FORM FIELD ── */
        .field-block { margin-bottom: 0.5rem; }

        .field-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            color: var(--dark-teal);
            margin-bottom: 0.5rem;
        }

        .field-label-req {
            color: var(--cayenne-red);
            font-size: 0.85rem;
        }

        .office-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(239,231,218,0.45);
            border: 1.5px solid rgba(14,71,73,0.18);
            border-radius: var(--radius-input);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.97rem;
            font-weight: 500;
            color: var(--evergreen);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }

        .office-input::placeholder {
            color: rgba(14,71,73,0.32);
            font-weight: 400;
        }

        .office-input:hover {
            border-color: rgba(14,71,73,0.32);
        }

        .office-input:focus {
            border-color: var(--dark-teal);
            box-shadow: 0 0 0 3.5px rgba(14,71,73,0.09);
            background: rgba(255,255,255,0.9);
        }

        .field-hint {
            margin-top: 0.4rem;
            font-size: 0.72rem;
            color: rgba(14,71,73,0.45);
        }

        /* ── ACTION BUTTONS ── */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-top: 1.5rem;
        }

        .btn-action {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.88rem 1.25rem;
            border: none;
            border-radius: var(--radius-btn);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.93rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition),
            box-shadow var(--transition),
            filter var(--transition),
            background var(--transition);
            overflow: hidden;
            letter-spacing: 0.2px;
        }

        /* Shimmer layer */
        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    105deg,
                    transparent 30%,
                    rgba(255,255,255,0.12) 50%,
                    transparent 70%
            );
            transform: translateX(-100%);
            transition: transform 0.45s ease;
        }

        .btn-action:hover::before {
            transform: translateX(100%);
        }

        .btn-action:hover {
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(0) scale(0.99);
        }

        /* Primary — Drivers */
        .btn-primary-dark {
            background: linear-gradient(135deg, var(--evergreen) 0%, var(--dark-teal) 100%);
            color: var(--lime-cream);
            box-shadow: 0 2px 8px rgba(0,38,38,0.22), 0 1px 2px rgba(0,38,38,0.15);
        }

        .btn-primary-dark:hover {
            box-shadow: 0 6px 20px rgba(0,38,38,0.30), 0 2px 6px rgba(0,38,38,0.18);
            filter: brightness(1.06);
        }

        /* Secondary — Buses */
        .btn-secondary-linen {
            background: rgba(255,255,255,0.55);
            color: var(--evergreen);
            border: 1.5px solid rgba(14,71,73,0.20);
            box-shadow: 0 1px 4px rgba(0,38,38,0.06);
        }

        .btn-secondary-linen:hover {
            background: var(--lime-cream);
            border-color: rgba(14,71,73,0.10);
            box-shadow: 0 4px 16px rgba(0,38,38,0.10);
            color: var(--evergreen);
        }

        .btn-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-icon-wrap {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-primary-dark .btn-icon-wrap {
            background: rgba(214,245,153,0.15);
        }

        .btn-secondary-linen .btn-icon-wrap {
            background: rgba(14,71,73,0.07);
        }

        .btn-icon-wrap svg {
            width: 15px;
            height: 15px;
        }

        .btn-arrow {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: transform var(--transition);
        }

        .btn-primary-dark .btn-arrow {
            background: rgba(214,245,153,0.12);
            color: var(--lime-cream);
        }

        .btn-secondary-linen .btn-arrow {
            background: rgba(14,71,73,0.07);
            color: var(--dark-teal);
        }

        .btn-action:hover .btn-arrow {
            transform: translateX(3px);
        }

        /* ── ERROR BANNER ── */
        .error-banner {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            background: rgba(229,88,18,0.07);
            border: 1px solid rgba(229,88,18,0.22);
            border-left: 3px solid var(--cayenne-red);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
        }

        .error-icon {
            font-size: 0.95rem;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .error-text {
            font-size: 0.83rem;
            color: #7a2000;
            line-height: 1.4;
        }

        /* ── CARD FOOTER NOTE ── */
        .card-foot {
            margin-top: 1.4rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(14,71,73,0.08);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.72rem;
            color: rgba(14,71,73,0.45);
        }

        .foot-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(14,71,73,0.25);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<header class="topbar">
    <a class="topbar-brand" th:href="@{/agency-office}">
        <div class="topbar-bus-icon">🚌</div>
        <span class="topbar-logo-text">BusTicket</span>
    </a>
    <div class="topbar-sep"></div>
    <span class="topbar-context">Agency Office Portal</span>
    <div class="topbar-spacer"></div>
</header>

<!-- ══ MAIN ══ -->
<main>
    <div class="portal-card">
        <div class="card-rail"></div>
        <div class="card-inner">

            <!-- Header -->
            <div class="page-eyebrow">
                <div class="eyebrow-dot"></div>
                <span class="eyebrow-text">Office Lookup</span>
            </div>
            <h1 class="page-title">Agency Office</h1>
            <p class="page-subtitle">Enter an office ID to retrieve associated drivers or buses.</p>
            <div class="card-divider"></div>

            <!-- Error -->
            <div th:if="${error}" class="error-banner">
                <span class="error-icon">⚠</span>
                <span class="error-text" th:text="${error}"></span>
            </div>

            <!-- Form -->
            <form method="get" th:action="@{/agency-office/drivers}">

                <div class="field-block">
                    <label class="field-label" for="officeId">
                        Office ID
                        <span class="field-label-req">*</span>
                    </label>
                    <input
                            class="office-input"
                            id="officeId"
                            name="officeId"
                            type="number"
                            min="1"
                            th:value="${officeId}"
                            placeholder="e.g. 1"
                            required
                            autocomplete="off"
                    />
                    <div class="field-hint">Must be a positive integer greater than 0</div>
                </div>

                <div class="btn-stack">

                    <!-- Get Drivers (Primary) -->
                    <button
                            class="btn-action btn-primary-dark"
                            type="submit"
                            th:formaction="@{/agency-office/drivers}"
                            th:formmethod="get">
                        <span class="btn-label">
                            <span class="btn-icon-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="8" r="4"/>
                                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                                </svg>
                            </span>
                            Get Drivers
                        </span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <!-- Get Buses (Secondary) -->
                    <button
                            class="btn-action btn-secondary-linen"
                            type="submit"
                            th:formaction="@{/agency-office/buses}"
                            th:formmethod="get">
                        <span class="btn-label">
                            <span class="btn-icon-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="1" y="3" width="15" height="13" rx="2"/>
                                    <path d="M16 8h4l3 5v3h-7V8z"/>
                                    <circle cx="5.5" cy="18.5" r="2.5"/>
                                    <circle cx="18.5" cy="18.5" r="2.5"/>
                                </svg>
                            </span>
                            Get Buses
                        </span>
                        <span class="btn-arrow">→</span>
                    </button>

                </div>
            </form>

            <!-- Footer note -->
            <div class="card-foot">
                <div class="foot-dot"></div>
                Data is fetched live from the backend service at each request.
            </div>

        </div>
    </div>
</main>

</body>
</html>
