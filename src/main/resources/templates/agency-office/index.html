<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Agency Office — Bus Ticket UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --evergreen:   #002626;
            --dark-teal:   #0e4749;
            --lime-cream:  #d6f599;
            --cayenne-red: #e55812;
            --soft-linen:  #efe7da;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--soft-linen);
            background-image:
                    radial-gradient(ellipse at 10% 0%,   rgba(14,71,73,0.18)   0%, transparent 55%),
                    radial-gradient(ellipse at 90% 100%,  rgba(0,38,38,0.22)    0%, transparent 55%),
                    radial-gradient(ellipse at 80% 10%,   rgba(229,88,18,0.10)  0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: var(--evergreen);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .topbar-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--lime-cream);
            letter-spacing: 0.5px;
        }
        .topbar-divider {
            width: 1px;
            height: 20px;
            background: rgba(214,245,153,0.25);
        }
        .topbar-sub {
            font-size: 0.78rem;
            color: rgba(214,245,153,0.55);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* ── CARD ── */
        .office-card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(14,71,73,0.14);
            border-radius: 24px;
            box-shadow:
                    0 2px 0  rgba(14,71,73,0.06),
                    0 20px 60px rgba(0,38,38,0.12);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .card-accent {
            height: 5px;
            background: linear-gradient(90deg, var(--evergreen) 0%, var(--dark-teal) 40%, var(--cayenne-red) 100%);
        }

        .card-body-inner {
            padding: 2.5rem 2.5rem 2rem;
        }

        /* ── ICON BADGE ── */
        .icon-badge {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--evergreen), var(--dark-teal));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.4rem;
            box-shadow: 0 4px 14px rgba(0,38,38,0.25);
        }
        .icon-badge svg { width: 26px; height: 26px; fill: none; stroke: var(--lime-cream); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── HEADINGS ── */
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.7rem;
            color: var(--evergreen);
            line-height: 1.15;
            margin-bottom: 0.35rem;
        }
        .card-caption {
            font-size: 0.875rem;
            color: rgba(14,71,73,0.70);
            font-weight: 400;
            margin-bottom: 1.8rem;
        }

        /* ── LABEL ── */
        .field-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--dark-teal);
            margin-bottom: 0.5rem;
        }

        /* ── INPUT ── */
        .office-input {
            width: 100%;
            padding: 0.72rem 1rem;
            background: rgba(239,231,218,0.55);
            border: 1.5px solid rgba(14,71,73,0.22);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--evergreen);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            appearance: none;
        }
        .office-input::placeholder { color: rgba(14,71,73,0.38); }
        .office-input:focus {
            border-color: var(--dark-teal);
            box-shadow: 0 0 0 3px rgba(14,71,73,0.10);
            background: #fff;
        }

        /* ── BUTTONS ── */
        .btn-group-stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.4rem;
        }
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.82rem 1.2rem;
            border: none;
            border-radius: 13px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            width: 100%;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:hover  { filter: brightness(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

        .btn-drivers {
            background: linear-gradient(135deg, var(--evergreen), var(--dark-teal));
            color: var(--lime-cream);
        }
        .btn-buses {
            background: var(--soft-linen);
            color: var(--evergreen);
            border: 1.5px solid rgba(14,71,73,0.22);
        }
        .btn-buses:hover { background: var(--lime-cream); }

        .btn-icon { display: flex; align-items: center; gap: 0.55rem; }
        .btn-arrow { font-size: 1rem; opacity: 0.6; }

        /* ── ERROR ALERT ── */
        .alert-error {
            background: rgba(229,88,18,0.10);
            border: 1px solid rgba(229,88,18,0.30);
            border-left: 4px solid var(--cayenne-red);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #8b2500;
            margin-bottom: 1.4rem;
        }

        /* ── FOOTER NOTE ── */
        .api-note {
            margin-top: 1.6rem;
            padding: 0.75rem 1rem;
            background: rgba(14,71,73,0.05);
            border-radius: 10px;
            font-size: 0.75rem;
            color: rgba(14,71,73,0.60);
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
        }
        .api-note code {
            background: rgba(14,71,73,0.10);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.72rem;
            color: var(--dark-teal);
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
    <span class="topbar-logo">🚌 BusTicket</span>
    <span class="topbar-divider"></span>
    <span class="topbar-sub">Agency Office Portal</span>
</header>

<!-- MAIN -->
<main>
    <div class="office-card">
        <div class="card-accent"></div>
        <div class="card-body-inner">

            <!-- HEADING -->
            <h1 class="card-title">Agency Office</h1>
            <hr style="border: none; border-top: 1px solid rgba(14,71,73,0.15); margin: 0.6rem 0 1.6rem;">

            <!-- ERROR -->
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <!-- FORM -->
            <form method="get" th:action="@{/agency-office/drivers}">

                <label class="field-label" for="officeId">Office ID</label>
                <input
                        class="office-input"
                        id="officeId"
                        name="officeId"
                        type="number"
                        min="1"
                        th:value="${officeId}"
                        placeholder="e.g. 1"
                        required
                />

                <div class="btn-group-stack">
                    <!-- Drivers -->
                    <button
                            class="btn-action btn-drivers"
                            type="submit"
                            th:formaction="@{/agency-office/drivers}"
                            th:formmethod="get">
                        <span class="btn-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                            Get Drivers
                        </span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <!-- Buses -->
                    <button
                            class="btn-action btn-buses"
                            type="submit"
                            th:formaction="@{/agency-office/buses}"
                            th:formmethod="get">
                        <span class="btn-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                            Get Buses
                        </span>
                        <span class="btn-arrow">→</span>
                    </button>
                </div>

            </form>

        </div>
    </div>
</main>

</body>
</html>
