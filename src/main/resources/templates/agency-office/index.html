<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Agency Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="app-card app-card-pad text-center">

                <h1 class="app-heading h3 mb-2">Agency Office</h1>
                <p class="app-subtitle mb-4">Enter an office ID to fetch buses or drivers.</p>

                    <!-- ERROR MESSAGE -->
                <div th:if="${error}" class="alert alert-danger text-start" th:text="${error}"></div>

                <form method="get" th:action="@{/agency-office/drivers}">
                    <label class="form-label text-start" for="officeId">Office ID</label>
                    <input class="form-control app-field"
                           id="officeId"
                           name="officeId"
                           type="number"
                           min="1"
                           th:value="${officeId}"
                           required
                           placeholder="e.g. 1">

                    <div class="d-grid gap-2 mt-3">
                        <button class="btn btn-lg app-btn-primary" type="submit"
                                th:formaction="@{/agency-office/drivers}"
                                th:formmethod="get">
                            Get Drivers
                        </button>
                        <button class="btn btn-lg app-btn-outline" type="submit"
                                th:formaction="@{/agency-office/buses}"
                                th:formmethod="get">
                            Get Buses
                        </button>
                    </div>
                </form>

                <div class="alert alert-info mt-4 mb-0 text-start">
                    <small>
                        Backend APIs used:
                        <code>/api/offices/buses</code>,
                        <code>/api/offices/drivers</code>
                    </small>
                </div>

            </div>

        </div>
    </div>

</main>

</body>
</html>
