<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Office Drivers — Bus Ticket UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* ── DESIGN TOKENS (identical across all pages) ── */
        :root {
            --evergreen:   #002626;
            --dark-teal:   #0e4749;
            --lime-cream:  #d6f599;
            --cayenne-red: #e55812;
            --soft-linen:  #efe7da;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--soft-linen);
            background-image:
                    radial-gradient(ellipse at 10% 0%,   rgba(14,71,73,0.18)  0%, transparent 55%),
                    radial-gradient(ellipse at 90% 100%,  rgba(0,38,38,0.22)   0%, transparent 55%),
                    radial-gradient(ellipse at 80% 10%,   rgba(229,88,18,0.10) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: var(--evergreen);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }
        .topbar-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--lime-cream);
            letter-spacing: 0.5px;
        }
        .topbar-divider { width: 1px; height: 20px; background: rgba(214,245,153,0.25); }
        .topbar-sub {
            font-size: 0.78rem;
            color: rgba(214,245,153,0.55);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── PAGE CONTENT ── */
        main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 3rem 1rem;
        }
        .page-wrapper { width: 100%; max-width: 660px; }

        /* ── BACK LINK ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--dark-teal);
            text-decoration: none;
            padding: 0.38rem 0.9rem 0.38rem 0.65rem;
            background: rgba(255,255,255,0.65);
            border: 1px solid rgba(14,71,73,0.15);
            border-radius: 8px;
            margin-bottom: 1.4rem;
            transition: background 0.15s, color 0.15s;
        }
        .back-link:hover { background: var(--lime-cream); color: var(--evergreen); text-decoration: none; }

        /* ── RESULT CARD ── */
        .result-card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(14,71,73,0.14);
            border-radius: 24px;
            box-shadow: 0 2px 0 rgba(14,71,73,0.06), 0 20px 60px rgba(0,38,38,0.12);
            overflow: hidden;
        }
        .card-accent {
            height: 5px;
            background: linear-gradient(90deg, var(--evergreen) 0%, var(--dark-teal) 40%, var(--cayenne-red) 100%);
        }

        /* ── CARD HEADER ── */
        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.6rem 2rem 1.2rem;
            border-bottom: 1px solid rgba(14,71,73,0.09);
        }
        .card-heading {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            color: var(--evergreen);
        }
        .card-heading span { color: var(--dark-teal); }

        /* ── TABLE ── */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table thead tr {
            background: rgba(14,71,73,0.05);
            border-bottom: 2px solid rgba(14,71,73,0.10);
        }
        .data-table thead th {
            padding: 0.85rem 2rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--dark-teal);
            text-align: left;
        }
        .data-table tbody tr {
            border-bottom: 1px solid rgba(14,71,73,0.07);
            transition: background 0.12s;
        }
        .data-table tbody tr:last-child { border-bottom: none; }
        .data-table tbody tr:hover { background: rgba(214,245,153,0.20); }
        .data-table tbody td { padding: 0.9rem 2rem; font-size: 0.92rem; color: var(--evergreen); }

        .id-badge {
            display: inline-block;
            background: rgba(14,71,73,0.09);
            color: var(--dark-teal);
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ── COUNT FOOTER ── */
        .card-footer-row {
            padding: 0.65rem 2rem;
            background: rgba(14,71,73,0.03);
            border-top: 1px solid rgba(14,71,73,0.07);
            font-size: 0.78rem;
            color: rgba(14,71,73,0.55);
            display: flex;
            justify-content: space-between;
        }

        /* ── STATE MESSAGES ── */
        .state-block { padding: 2.8rem 2rem; text-align: center; }
        .state-emoji { font-size: 2.4rem; margin-bottom: 0.7rem; }
        .state-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem;
            color: var(--evergreen);
            margin-bottom: 0.4rem;
        }
        .state-body { font-size: 0.875rem; color: rgba(14,71,73,0.65); }
        .state-block.is-error .state-title { color: var(--cayenne-red); }
    </style>
</head>
<body>

<!-- ── TOP BAR ── -->
<header class="topbar">
    <span class="topbar-logo">🚌 BusTicket</span>
    <span class="topbar-divider"></span>
    <span class="topbar-sub">Agency Office</span>
</header>

<!-- ── MAIN ── -->
<main>
    <div class="page-wrapper">

        <a class="back-link" th:href="@{/agency-office}">← Back</a>

        <div class="result-card">
            <div class="card-accent"></div>

            <!-- CARD HEADER -->
            <div class="card-header-row">
                <h1 class="card-heading">
                    Drivers &mdash; Office <span th:text="${officeId}"></span>
                </h1>
            </div>

            <!-- CASE 1: OFFICE NOT FOUND / BACKEND ERROR -->
            <div th:if="${error}" class="state-block is-error">
                <div class="state-emoji">⚠️</div>
                <div class="state-title">Office Not Found</div>
                <div class="state-body" th:text="${error}"></div>
            </div>

            <!-- CASE 2: DRIVERS RETURNED -->
            <div th:if="${drivers != null and not #lists.isEmpty(drivers)}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Driver ID</th>
                        <th>Full Name</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="driver : ${drivers}">
                        <td><span class="id-badge" th:text="'#' + ${driver.driverId}"></span></td>
                        <td th:text="${driver.name}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="card-footer-row">
                    <span th:text="${#lists.size(drivers)} + ' driver(s) found'"></span>
                    <span>Office #<span th:text="${officeId}"></span></span>
                </div>
            </div>

            <!-- CASE 3: EMPTY LIST -->
            <div th:if="${drivers != null and #lists.isEmpty(drivers)}" class="state-block">
                <div class="state-emoji">🔍</div>
                <div class="state-title">No Drivers Found</div>
                <div class="state-body">
                    Office <strong th:text="${officeId}"></strong> has no drivers assigned at this time.
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
