<!DOCTYPE html>
<!--
    Page: Agency Customers
    Purpose: Fetch and display customers associated with a specific agency
    Data Source: Backend via Thymeleaf (customers list, error)

    Features:
      - Input form to enter agencyId
      - Displays customer details in card format
      - Handles error messages from backend

    States:
      - Initial (no data loaded)
      - Results (customers displayed)
      - Empty (no customers found)
      - Error (invalid agency / backend issue)

    Flow:
      - User enters agencyId → /agency/customers → customers displayed
-->

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/customers.css?v=2}">
    <title>Agency Customers</title>
</head>
<body>

<h2>Fetch Customers by Agency</h2>

<!-- FORM -->
<div class="container">
    <form action="/agency/customers" method="get">
        <label>Enter Agency ID:</label>
        <input type="number" name="agencyId" placeholder="Enter Agency ID" required />
        <button type="submit">Get Customers</button>
    </form>
</div>

<hr>

<!-- Card -->
<div class="card-container">

    <div class="card" th:each="c : ${customers}">
        <h3 th:text="${c.name}"></h3>
        <p><strong>ID:</strong> <span th:text="${c.customerId}"></span></p>
        <p><strong>Email:</strong> <span th:text="${c.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${c.phone}"></span></p>
    </div>

</div>

<div class="error-box" th:if="${error}">
    <p th:text="${error}"></p>
</div>

<p class="no-data" th:if="${customers != null and #lists.isEmpty(customers)}">
    No customers found for this agency.
</p>

<p class="no-data" th:if="${customers == null and error == null}">
    No data loaded yet. Enter Agency ID above.
</p>

</body>
</html>
